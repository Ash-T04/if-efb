<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Flight EFB - Pro Auto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // --- 1. AIRCRAFT DATABASE (OEW & MTOW in kg) ---
        const aircraftDB = {
            "A318": { oew: 39500, mtow: 68000 },
            "A319": { oew: 40800, mtow: 75500 },
            "A320": { oew: 42600, mtow: 78000 },
            "A321": { oew: 48500, mtow: 93500 },
            "A333": { oew: 129400, mtow: 242000 },
            "A339": { oew: 137000, mtow: 251000 },
            "A359": { oew: 142400, mtow: 280000 },
            "A388": { oew: 276800, mtow: 575000 },
            "B737": { oew: 37784, mtow: 70080 },
            "B738": { oew: 41413, mtow: 79015 },
            "B752": { oew: 58440, mtow: 115680 },
            "B763": { oew: 86070, mtow: 186880 },
            "B772": { oew: 135800, mtow: 297550 },
            "B77W": { oew: 167829, mtow: 351533 },
            "B788": { oew: 119950, mtow: 227930 },
            "B744": { oew: 183500, mtow: 396890 },
            "CRJ2": { oew: 13835, mtow: 24041 },
            "CRJ7": { oew: 19731, mtow: 34019 },
            "CRJ9": { oew: 21433, mtow: 38330 },
            "CRJX": { oew: 23179, mtow: 41640 },
            "DH8D": { oew: 17185, mtow: 29257 },
            "E175": { oew: 21890, mtow: 38790 },
            "E190": { oew: 28080, mtow: 51800 },
            "C172": { oew: 767, mtow: 1157 },
            "TBM": { oew: 2132, mtow: 3354 },
            "CCX": { oew: 9843, mtow: 16374 }
        };

        // --- 2. AIRPORT RUNWAY DATABASE ---
        const airportDB = {
            "EGLL": [ {id: "09L/27R", len: 3902}, {id: "09R/27L", len: 3658} ],
            "KJFK": [ {id: "13R/31L", len: 4423}, {id: "04L/22R", len: 3460}, {id: "13L/31R", len: 3048}, {id: "04R/22L", len: 2560} ],
            "KLAX": [ {id: "07L/25R", len: 3685}, {id: "07R/25L", len: 3382}, {id: "06R/24L", len: 3135}, {id: "06L/24R", len: 2720} ],
            "YSSY": [ {id: "16R/34L", len: 3962}, {id: "16L/34R", len: 2438}, {id: "07/25", len: 2530} ],
            "OMDB": [ {id: "12L/30R", len: 4000}, {id: "12R/30L", len: 4000} ]
        };

        // Tab switching logic
        function switchTab(tabName) {
            document.getElementById('takeoff-section').classList.add('hidden');
            document.getElementById('landing-section').classList.add('hidden');
            document.getElementById('takeoff-tab').classList.remove('bg-sky-600', 'text-white');
            document.getElementById('landing-tab').classList.remove('bg-sky-600', 'text-white');
            
            document.getElementById(tabName + '-section').classList.remove('hidden');
            document.getElementById(tabName + '-tab').classList.add('bg-sky-600', 'text-white');
        }

        // Auto-fetch runways based on ICAO input
        function autoFetchRunways(type) {
            let icao = document.getElementById(type + '-icao').value.toUpperCase();
            let selectBox = document.getElementById(type + '-rwy-select');
            let manualBox = document.getElementById(type + '-rwy-manual');
            
            // Clear current options
            selectBox.innerHTML = '';

            if (airportDB[icao]) {
                airportDB[icao].forEach(rwy => {
                    let option = document.createElement("option");
                    option.value = rwy.len;
                    option.text = `${rwy.id} (${rwy.len}m)`;
                    selectBox.appendChild(option);
                });
                let manualOpt = document.createElement("option");
                manualOpt.value = "manual";
                manualOpt.text = "Other (Manual Entry)";
                selectBox.appendChild(manualOpt);
                
                manualBox.classList.add('hidden');
            } else {
                let manualOpt = document.createElement("option");
                manualOpt.value = "manual";
                manualOpt.text = "Airport not in DB (Manual Entry)";
                selectBox.appendChild(manualOpt);
                manualBox.classList.remove('hidden');
            }
        }

        // Toggle Manual Runway Entry Box
        function checkRunwayManual(type) {
            let select = document.getElementById(type + '-rwy-select');
            let manual = document.getElementById(type + '-rwy-manual');
            if (select.value === "manual") {
                manual.classList.remove('hidden');
            } else {
                manual.classList.add('hidden');
            }
        }

        // Calculate Gross Weight from Load Percentage
        function calculateCurrentWeight(loadPercentage) {
            let acType = document.getElementById('aircraft-select').value;
            let acData = aircraftDB[acType];
            let loadDecimal = loadPercentage / 100;
            return acData.oew + (loadDecimal * (acData.mtow - acData.oew));
        }

        // Takeoff Calculator
        function calculateTakeoff() {
            let loadPct = parseFloat(document.getElementById('tk-load').value);
            let rwySelect = document.getElementById('dep-rwy-select').value;
            let tora = rwySelect === "manual" ? parseFloat(document.getElementById('dep-rwy-manual').value) : parseFloat(rwySelect);
            let temp = parseFloat(document.getElementById('tk-temp').value);
            
            if (!tora || isNaN(loadPct) || loadPct < 0 || loadPct > 100) return alert("Please enter a valid Load % (0-100) and Runway Length.");

            let weight = calculateCurrentWeight(loadPct);
            let baseDist = 1200 + ((weight - 60000) * 0.035);
            let margin = tora - baseDist;
            let flex = Math.min(temp + Math.floor(margin / 18), 55);

            // N1 Calculation (Base TOGA 101.5%, reduced by flex differential)
            let targetN1 = Math.max(85, (101.5 - ((flex - temp) * 0.25))).toFixed(1);

            document.getElementById('v1').innerText = Math.floor(118 + (weight/5200));
            document.getElementById('vr').innerText = Math.floor(124 + (weight/5200));
            document.getElementById('v2').innerText = Math.floor(130 + (weight/5200));
            
            let flexEl = document.getElementById('flex');
            let n1El = document.getElementById('tk-n1');
            
            if (flex > temp && margin > 0) {
                flexEl.innerText = flex + "°C";
                flexEl.className = "text-2xl font-bold text-amber-400";
                n1El.innerText = targetN1 + "%";
            } else {
                flexEl.innerText = "TOGA REQUIRED";
                flexEl.className = "text-xl font-bold text-red-500";
                n1El.innerText = "101.5%";
            }
            
            document.getElementById('tk-calculated-weight').innerText = `Computed Gross Weight: ${Math.floor(weight).toLocaleString()} kg`;
            document.getElementById('takeoff-results').classList.remove('hidden');
        }

        // Landing Calculator
        function calculateLanding() {
            let loadPct = parseFloat(document.getElementById('ld-load').value);
            let rwySelect = document.getElementById('arr-rwy-select').value;
            let lda = rwySelect === "manual" ? parseFloat(document.getElementById('arr-rwy-manual').value) : parseFloat(rwySelect);
            let autobrake = parseFloat(document.getElementById('autobrake').value);
            let reverseThrustMult = parseFloat(document.getElementById('ld-reverse').value);

            if (!lda || isNaN(loadPct) || loadPct < 0 || loadPct > 100) return alert("Please enter a valid Load % (0-100) and Runway Length.");

            let weight = calculateCurrentWeight(loadPct);
            let vref = Math.floor(125 + (weight/5500));
            
            // Base LDR calculation influenced by autobrake and reverse thrust setting
            let baseLdr = 900 + ((weight - 50000) * 0.02);
            let requiredDist = baseLdr * autobrake * reverseThrustMult;
            let margin = lda - requiredDist;

            document.getElementById('vref').innerText = vref + " kt";
            document.getElementById('ldr').innerText = Math.floor(requiredDist) + " m";
            
            let marginEl = document.getElementById('ld-margin');
            if (margin > 0) {
                marginEl.innerText = "+" + Math.floor(margin) + " m (SAFE)";
                marginEl.className = "text-xl font-bold text-emerald-400";
            } else {
                marginEl.innerText = Math.floor(margin) + " m (OVERRUN RISK)";
                marginEl.className = "text-xl font-bold text-red-500";
            }
            
            document.getElementById('ld-calculated-weight').innerText = `Computed Landing Weight: ${Math.floor(weight).toLocaleString()} kg`;
            document.getElementById('landing-results').classList.remove('hidden');
        }
    </script>
</head>
<body class="bg-slate-900 text-white font-sans p-4 md:p-8 min-h-screen">
    <div class="max-w-2xl mx-auto bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl overflow-hidden">
        
        <!-- Header & Tabs -->
        <div class="p-6 pb-0">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-sky-400">✈️ EFB Auto-Perf Calculator</h1>
                <span class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full border border-slate-600">v4.0</span>
            </div>
            
            <!-- Aircraft Selector -->
            <div class="mb-6">
                <label class="block text-xs text-slate-400 mb-1 uppercase font-semibold">Aircraft Type (Sets OEW & MTOW)</label>
                <select id="aircraft-select" class="w-full bg-slate-900 p-3 rounded-lg text-white border border-slate-700 focus:border-sky-500 outline-none">
                    <optgroup label="Airbus">
                        <option value="A318">A318-100</option>
                        <option value="A319">A319-100</option>
                        <option value="A320" selected>A320-200</option>
                        <option value="A321">A321-200</option>
                        <option value="A333">A330-300</option>
                        <option value="A339">A330-900neo</option>
                        <option value="A359">A350-900</option>
                        <option value="A388">A380-800</option>
                    </optgroup>
                    <optgroup label="Boeing">
                        <option value="B737">737-700</option>
                        <option value="B738">737-800</option>
                        <option value="B752">757-200</option>
                        <option value="B763">767-300</option>
                        <option value="B772">777-200ER</option>
                        <option value="B77W">777-300ER</option>
                        <option value="B788">787-8 Dreamliner</option>
                        <option value="B744">747-400</option>
                    </optgroup>
                    <optgroup label="Bombardier / Embraer">
                        <option value="CRJ2">CRJ-200</option>
                        <option value="CRJ7">CRJ-700</option>
                        <option value="CRJ9">CRJ-900</option>
                        <option value="CRJX">CRJ-1000</option>
                        <option value="DH8D">Dash 8 Q400</option>
                        <option value="E175">E175</option>
                        <option value="E190">E190</option>
                    </optgroup>
                    <optgroup label="General Aviation / Other">
                        <option value="C172">Cessna 172</option>
                        <option value="TBM">TBM-930</option>
                        <option value="CCX">Citation X</option>
                    </optgroup>
                </select>
            </div>

            <!-- Tabs -->
            <div class="flex border-b border-slate-700">
                <button id="takeoff-tab" onclick="switchTab('takeoff')" class="flex-1 py-3 text-center font-semibold bg-sky-600 text-white rounded-t-lg transition">Takeoff (DEP)</button>
                <button id="landing-tab" onclick="switchTab('landing')" class="flex-1 py-3 text-center font-semibold text-slate-400 hover:text-white transition">Landing (ARR)</button>
            </div>
        </div>

        <!-- TAKEOFF SECTION -->
        <div id="takeoff-section" class="p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1 uppercase font-semibold">Departure ICAO</label>
                    <input id="dep-icao" type="text" onkeyup="autoFetchRunways('dep')" placeholder="e.g. EGLL or KJFK" class="w-full bg-slate-900 p-3 rounded-lg text-white border border-slate-700 focus:border-sky-500 uppercase outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 uppercase font-semibold">Dep Runway (TORA)</label>
                    <select id="dep-rwy-select" onchange="checkRunwayManual('dep')" class="w-full bg-slate-900 p-3 rounded-lg text-white border border-slate-700 focus:border-sky-500 outline-none">
                        <option value="manual">Awaiting ICAO...</option>
                    </select>
                    <input id="dep-rwy-manual" type="number" placeholder="Enter TORA in meters" class="w-full bg-slate-900 p-3 mt-2 rounded-lg text-white border border-slate-700 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 uppercase font-semibold">Aircraft Load (%)</label>
                    <input id="tk-load" type="number" placeholder="0-100" value="65" class="w-full bg-slate-900 p-3 rounded-lg text-white border border-slate-700 focus:border-sky-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 uppercase font-semibold">OAT (°C)</label>
                    <input id="tk-temp" type="number" value="15" class="w-full bg-slate-900 p-3 rounded-lg text-white border border-slate-700 focus:border-sky-500 outline-none">
                </div>
            </div>

            <button onclick="calculateTakeoff()" class="w-full mt-6 bg-sky-600 hover:bg-sky-500 font-bold py-3 rounded-xl transition shadow-lg shadow-sky-900/50">
                Calculate Takeoff
            </button>

            <!-- Takeoff Results -->
            <div id="takeoff-results" class="mt-6 p-4 bg-slate-900 rounded-xl border border-slate-700 hidden">
                <p id="tk-calculated-weight" class="text-xs text-slate-400 mb-3 font-mono"></p>
                <div class="grid grid-cols-3 gap-3 text-center mb-4">
                    <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
                        <span class="text-xs text-slate-400 block">V1</span>
                        <p id="v1" class="text-2xl font-bold text-emerald-400">-</p>
                    </div>
                    <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
                        <span class="text-xs text-slate-400 block">VR</span>
                        <p id="vr" class="text-2xl font-bold text-emerald-400">-</p>
                    </div>
                    <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
                        <span class="text-xs text-slate-400 block">V2</span>
                        <p id="v2" class="text-2xl font-bold text-emerald-400">-</p>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4 border-t border-slate-800 pt-4">
                    <div class="text-center">
                        <span class="text-xs text-slate-400 uppercase tracking-wide">Assumed Flex Temp</span>
                        <p id="flex" class="text-2xl font-bold text-amber-400">-</p>
                    </div>
                    <div class="text-center">
                        <span class="text-xs text-slate-400 uppercase tracking-wide">Target Takeoff N1</span>
                        <p id="tk-n1" class="text-2xl font-bold text-sky-400">-</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- LANDING SECTION -->
        <div id="landing-section" class="p-6 hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1 uppercase font-semibold">Arrival ICAO</label>
                    <input id="arr-icao" type="text" onkeyup="autoFetchRunways('arr')" placeholder="e.g. KLAX or OMDB" class="w-full bg-slate-900 p-3 rounded-lg text-white border border-slate-700 focus:border-sky-500 uppercase outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 uppercase font-semibold">Arr Runway (LDA)</label>
                    <select id="arr-rwy-select" onchange="checkRunwayManual('arr')" class="w-full bg-slate-900 p-3 rounded-lg text-white border border-slate-700 focus:border-sky-500 outline-none">
                        <option value="manual">Awaiting ICAO...</option>
                    </select>
                    <input id="arr-rwy-manual" type="number" placeholder="Enter LDA in meters" class="w-full bg-slate-900 p-3 mt-2 rounded-lg text-white border border-slate-700 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 uppercase font-semibold">Est Landing Load (%)</label>
                    <input id="ld-load" type="number" placeholder="0-100" value="40" class="w-full bg-slate-900 p-3 rounded-lg text-white border border-slate-700 focus:border-sky-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 uppercase font-semibold">Autobrake</label>
                    <select id="autobrake" class="w-full bg-slate-900 p-3 rounded-lg text-white border border-slate-700 focus:border-sky-500 outline-none">
                        <option value="1.5">LOW / 1</option>
                        <option value="1.2" selected>MED / 2</option>
                        <option value="0.9">MAX / 3</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs text-slate-400 mb-1 uppercase font-semibold">Reverse Thrust Level</label>
                    <select id="ld-reverse" class="w-full bg-slate-900 p-3 rounded-lg text-white border border-slate-700 focus:border-sky-500 outline-none">
                        <option value="1.15">Idle Reverse (Minimal Braking)</option>
                        <option value="1.05">60% N1</option>
                        <option value="0.95" selected>80% N1 (Standard Braking)</option>
                        <option value="0.90">MAX Reverse (Heavy Braking)</option>
                    </select>
                </div>
            </div>

            <button onclick="calculateLanding()" class="w-full mt-6 bg-sky-600 hover:bg-sky-500 font-bold py-3 rounded-xl transition shadow-lg shadow-sky-900/50">
                Calculate Landing Distance
            </button>

            <!-- Landing Results -->
            <div id="landing-results" class="mt-6 p-4 bg-slate-900 rounded-xl border border-slate-700 hidden">
                <p id="ld-calculated-weight" class="text-xs text-slate-400 mb-3 font-mono"></p>
                <div class="grid grid-cols-2 gap-3 text-center">
                    <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
                        <span class="text-xs text-slate-400 block">Approach Speed (VREF)</span>
                        <p id="vref" class="text-2xl font-bold text-sky-400">-</p>
                    </div>
                    <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
                        <span class="text-xs text-slate-400 block">Stopping Distance</span>
                        <p id="ldr" class="text-2xl font-bold text-sky-400">-</p>
                    </div>
                </div>
                <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center px-2">
                    <span class="text-sm text-slate-400 font-medium">Runway Margin Remaining:</span>
                    <p id="ld-margin" class="text-xl font-bold">-</p>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
